
name: Generate Purple Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: Harshitaonweb
          outputs: |
            dist/github-snake.svg?color_snake=%23F5D0FE&color_dots=%23140B20%2C%233B1D5B%2C%237C3AED%2C%23A855F7%2C%23E9D5FF

      - name: Publish snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
